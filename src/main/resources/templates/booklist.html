<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
xmlns:sec="http://thymeleaf.org/thymeleaf-extras-springsecurity6">
    <head>
        <title>Booklist</title>
        <meta http-equiv="Content-Type" content="text/html"; charset="UTF-8"/>
        <link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />
    </head>
    <body>
        <h1>List of Books</h1>
        
        <h3>Welcome <span sec:authentication="name"></span></h3>
        <table class="table table-striped">
            <tr>

            <th>Author</th>
            <th>Title</th>
            <th>Isbn</th>
            <th>Year</th>
            <th>Category</th>

            </tr>
        <tr th:each = "book : ${booklist}">
            <td th:text="${book.author}"></td>
            <td th:text="${book.title}"></td>
            <td th:text="${book.isbn}"></td>
            <td th:text="${book.publicationYear}"></td>
            <td th:text ="${book.category}"></td>
            <td sec:authorize="hasAuthority('ADMIN')"><a class="btn btn-danger" th:href="@{/delete/{id}(id=${book.id})}">Delete</a></td>
            <td><a th:href="@{/edit/{id}(id=${book.id})}">Edit</a></td>
        </tr>
        </table>
        <a class="btn btn-success" href="/add">Add books</a>
        <div class="col-md-4" style="padding: 20px 0;">
            <form th:action="@{/logout}" method="post">
                <input type="submit" value="Sign Out" class="btn btn-sm btn-danger"/>
            </form>

    </body>
</html>
